budgets:
- 64
- 128
- 256
- 512
- 1024
- 2048
- 4096
- null
compression_methods:
- no_compression
- last_k_turns
- hybrid
- claude_context
method_options:
  claude_context:
    recent_turns: 4
    retrieval_turns: 2
    max_summary_turns: 12
    summary_preview_chars: 120
    stub_preview_chars: 80
    enable_tool_clearing: true
    enable_thinking_clearing: true
    enable_compaction: true
    enable_artifact_stubs: true
    enable_cache_awareness: true
    tool_clear_threshold_tokens: null
    thinking_clear_threshold_tokens: null
    compaction_threshold_tokens: null
    cache_prefix_turns: 0
    allow_cache_invalidation_on_emergency: true
hybrid_allocation:
  recent_ratio: 0.3
  retrieval_ratio: 0.4
  summary_ratio: 0.3
last_k_default: 20
max_samples: 32
sample_strategy: stratified
context_format: evidence
retrieval_top_k: null
retrieval_candidate_k: 64
neighbor_window_size: 1
dense_retrieval_model: sentence-transformers/all-MiniLM-L6-v2
enable_llm_judge: true
attention_examples_per_method: 1
attention_budget_labels:
- 512
attention_layers:
- early
- mid
- late
model: Qwen/Qwen3-4B-Instruct-2507
output_dir: results/claude_context_experiment
seed: 42
session_summary_source: dataset
system_prompt: You are Qwen, a helpful AI assistant. Answer the following question
  based on the conversation history provided. Only use information from the conversation.
  If the conversation does not contain enough information to answer, say so. Answer
  in one short phrase unless the question requires a full sentence.

